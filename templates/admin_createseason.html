{% block admin_createseason %}
<h3>Create New Season</h3>
<form id="createSeasonForm" method="POST" action="/admin/create_season">
    <div class="row mb-3">
        <div class="col-md-4">
            <label for="seasonName" class="form-label">Season Name</label>
            <input class="form-control" type="text" id="seasonName" name="name" required>
        </div>
        <div class="col-md-4">
            <label for="startDate" class="form-label">Start Date</label>
            <input class="form-control" type="date" id="startDate" name="start_date" required>
        </div>
        <!-- End date and game type removed -->
    </div>
    <button type="submit" class="btn btn-success" id="createSeasonBtn">Create Season & Schedule</button>
</form>
<div id="createSeasonResult" class="mt-3"></div>
<div class="d-flex align-items-center mb-2">
    <button class="btn btn-outline-secondary btn-sm me-2" id="refreshPlayerGroupsBtn">Refresh Player Groups</button>
    <span class="text-muted">(Shows all players by game type, division, and group)</span>
</div>
<div id="gameTypePills" class="mb-2"></div>
<div id="playerGroupsView" class="mt-2"></div>
<!-- Preview modal removed -->
{% endblock %}
<script>
document.getElementById('createSeasonForm').onsubmit = function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    fetch(form.action, {
        method: 'POST',
        body: formData
    })
    .then(r => r.text())
    .then(html => {
        // Try to extract flash message from returned HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const alert = doc.querySelector('.alert');
        if (alert) {
            document.getElementById('createSeasonResult').innerHTML = alert.outerHTML;
        } else {
            document.getElementById('createSeasonResult').innerHTML = '<div class="alert alert-success">Season created!</div>';
        }
        setTimeout(() => window.location.reload(), 1200);
    })
    .catch(() => {
        document.getElementById('createSeasonResult').innerHTML = '<div class="alert alert-danger">Error creating season</div>';
    });
};
</script>
